name: Build Android

on:
  push:
    branches: [android-port]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Android64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          sdk: given
          target: Android64
          combine: true

      - uses: actions/upload-artifact@v4
        with:
          name: afterflow-android64
          path: ${{ steps.build.outputs.build-output }}
